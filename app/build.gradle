/* 소스 안내
 * Android SDK·의존성·build type·JNI 패키징과 검색 자산 무결성 preBuild 검사를 정의한다.
 */
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.kapt)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.objectbox)
}

def snapdragonVersion = 'b12248'
def snapdragonArtifact = "llama-${snapdragonVersion}-bin-android-arm64-snapdragon.tar.gz"
def snapdragonHash = 'bc2743c5370947d8524554b7d6dd5da1a87b95620556fe76240313633077124f'
def acceleratorLibs = layout.buildDirectory.dir('generated/llama-accelerator/jniLibs')
def acceleratorAssets = layout.buildDirectory.dir('generated/llama-accelerator/assets')

android {
    namespace 'com.minyook.sllm2'
    compileSdkVersion 37

    defaultConfig {
        applicationId "com.minyook.sllm2"
        minSdk 26
        targetSdk 37
        versionCode 2
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DCMAKE_BUILD_TYPE=Release'
            }
        }
    }

    buildFeatures {
        buildConfig true
        resValues true
        compose true
    }

    ndkVersion '28.2.13676358'
    sourceSets.main {
        jniLibs.srcDir acceleratorLibs.get().asFile
        assets.srcDir acceleratorAssets.get().asFile
    }
    packaging {
        jniLibs {
            // The backend loader needs filesystem paths to the vendor plugins.
            useLegacyPackaging = true
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            if (providers.gradleProperty('designPreview').orNull == 'true') {
                applicationIdSuffix '.designpreview'
                versionNameSuffix '-design'
                resValue 'string', 'app_name', 'Field Guard 디자인'
            }
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

tasks.register('prepareLlamaAccelerators') {
    inputs.property('archiveSha256', snapdragonHash)
    outputs.dir(acceleratorLibs)
    outputs.dir(acceleratorAssets)
    doLast {
        def archive = rootProject.file("tmp/${snapdragonArtifact}")
        if (!archive.isFile()) {
            archive = layout.buildDirectory.file("downloads/${snapdragonArtifact}").get().asFile
            if (!archive.isFile()) {
                archive.parentFile.mkdirs()
                def partial = new File(archive.path + '.part')
                def connection = new URI("https://github.com/ggml-org/llama.cpp/releases/download/${snapdragonVersion}/${snapdragonArtifact}").toURL().openConnection()
                connection.connectTimeout = 30_000
                connection.readTimeout = 90_000
                connection.inputStream.withCloseable { input ->
                    partial.withOutputStream { output -> output << input }
                }
                if (!partial.renameTo(archive)) throw new GradleException("Could not save ${snapdragonArtifact}")
            }
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        archive.withInputStream { input ->
            byte[] buffer = new byte[65536]
            int count
            while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
        }
        if (digest.digest().encodeHex().toString() != snapdragonHash) {
            throw new GradleException("llama.cpp Snapdragon archive SHA-256 mismatch: ${archive}")
        }
        def files = tarTree(resources.gzip(archive))
        copy {
            from files
            into acceleratorLibs.get().dir('arm64-v8a')
            include "llama-${snapdragonVersion}/lib/libggml-hexagon.so", "llama-${snapdragonVersion}/lib/libggml-opencl.so"
            includeEmptyDirs = false
            eachFile { path = name }
        }
        copy {
            from files
            into acceleratorAssets.get().dir("llama-dsp-${snapdragonVersion}")
            include "llama-${snapdragonVersion}/lib/libggml-htp-v*.so"
            includeEmptyDirs = false
            eachFile { path = name }
        }
        ['libggml-hexagon.so', 'libggml-opencl.so'].each {
            if (!acceleratorLibs.get().file("arm64-v8a/${it}").asFile.isFile()) {
                throw new GradleException("Missing Snapdragon library ${it}")
            }
        }
        if (!acceleratorAssets.get().dir("llama-dsp-${snapdragonVersion}").asFile.listFiles()) {
            throw new GradleException('Missing Snapdragon DSP libraries')
        }
    }
}

kotlin {
    compilerOptions {
        // KAPT defaults to the Gradle daemon JDK (25 here) unless this is explicit.
        // Keep it aligned with Java's Android-compatible bytecode target.
        jvmTarget = JvmTarget.JVM_11
    }
}

dependencies {
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.activity.compose
    implementation libs.androidx.core.ktx
    implementation libs.androidx.work.runtime.ktx
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.22.0'
    testImplementation libs.junit
    testImplementation 'org.json:json:20250517'
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.junit
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest
}

tasks.register('verifySemanticAssets') {
    doLast {
        def metadata = new groovy.json.JsonSlurper().parse(rootProject.file('tools/semantic-model-files.json'))
        metadata.each { name, expected ->
            def asset = file("src/main/assets/semantic-model/${name}")
            if (!asset.exists() || asset.length() != expected.size) throw new GradleException('Run from repository root: node tools/prepare-semantic.mjs --android-only (prepares pinned local embedding assets)')
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            asset.withInputStream { input -> byte[] buffer = new byte[65536]; int count; while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count) }
            if (digest.digest().encodeHex().toString() != expected.sha256) throw new GradleException("Semantic asset integrity: ${name}")
        }
        def index = new groovy.json.JsonSlurper().parse(file('src/main/assets/knowledge/semantic-index-v1.json'))
        if (index.modelRevision != '5090578d9565bb06545b4552f76e6bc2c93e4a66' || index.dimensions != 768) throw new GradleException('Restore the pinned app/src/main/assets/knowledge/semantic-index-v1.json; model preparation does not rebuild the document index')
    }
}
tasks.named('preBuild').configure { dependsOn 'verifySemanticAssets', 'prepareLlamaAccelerators' }
