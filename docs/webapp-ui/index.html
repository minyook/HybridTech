<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>O₂ Field Guard · 웹앱 UI 시안</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-3.6-.8L3 21l1.8-4.8A8.5 8.5 0 1 1 20 11.5Z"/></symbol>
    <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M2 12h4l2.5-6 4 12 2.5-6H22"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6c-3-2-6-2-9-1v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1Zm0 0v14"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M4 7V3M4 7h4M4 7a9 9 0 1 1-1 8M12 7v5l3 2"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"/><circle cx="12" cy="12" r="4"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 11a7 7 0 0 0 14 0m-7 7v4m-4 0h8"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m3 3 18 9-18 9 3-9-3-9Zm3 9h15"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M3 9a15 15 0 0 1 18 0M6 13a10 10 0 0 1 12 0m-9 4a5 5 0 0 1 6 0m-3 4h.01"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.3 8.5 8 11 4.7-2.5 8-6 8-11V5z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m12 3 10 18H2L12 3Zm0 6v5m0 3h.01"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M5 2h9l5 5v15H5zM14 2v5h5M8 12h8M8 16h8"/></symbol>
    <symbol id="i-device" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 18h4"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5 19 19M19 5 5 19"/></symbol>
  </svg>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand" data-go="home" role="button" tabindex="0" aria-label="홈으로 이동">
        <div class="brand-mark">O<sub>2</sub></div>
        <div><strong>Field Guard</strong><span>현장 안전을 위한 로컬 지식</span></div>
      </div>
      <div class="sidebar-label">작업</div>
      <nav id="side-primary" aria-label="주요 메뉴"></nav>
      <div class="sidebar-label secondary-label">관리</div>
      <nav id="side-secondary" aria-label="관리 메뉴"></nav>
      <div class="side-foot"><span class="dot good"></span> 문서 오프라인 준비됨 <small>2개 문서 · 87개 근거</small></div>
    </aside>
    <div class="mobile-scrim" id="mobile-scrim" data-action="close-menu"></div>
    <div class="work-area">
      <header class="topbar">
        <button class="icon-button mobile-only" data-action="toggle-menu" aria-label="전체 메뉴 열기"><svg><use href="#i-menu"/></svg></button>
        <div class="topbar-title" id="topbar-title"></div>
        <div class="topbar-right"><span class="prototype-tag">인터랙티브 UI 시안</span><button class="topbar-status" data-go="sensor"><span class="dot neutral"></span> 측정 대기 <svg><use href="#i-chevron"/></svg></button></div>
      </header>
      <main id="main" tabindex="-1"></main>
      <nav class="bottom-nav" id="bottom-nav" aria-label="모바일 주요 메뉴"></nav>
    </div>
  </div>
  <div id="dialog-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
